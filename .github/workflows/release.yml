# Release of the public repository: a pushed tag builds the plugin from that source, attests the three files and
# publishes them, so anyone can check that the released main.js is what this source builds.
# In the private repository this file lives outside `.github/`; tools/export-public.mjs puts it there.
name: release

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The tag is the version in manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Notes from CHANGELOG.md
        run: |
          node -e '
            const lines = require("fs").readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.indexOf(`## ${process.env.GITHUB_REF_NAME}`);
            if (start === -1) throw new Error(`CHANGELOG.md has no section ## ${process.env.GITHUB_REF_NAME}`);
            const end = lines.findIndex((line, at) => at > start && line.startsWith("## "));
            console.log(lines.slice(start + 1, end === -1 ? undefined : end).join("\n").trim());
          ' > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css
          --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
